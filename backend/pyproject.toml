[project]
name = "aqt"
version = "0.1.0"
description = "AI Quant Trader (Taiwan) — research & SIMULATED trading only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0.30", "psycopg[binary]>=3.2",
  "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3", "httpx>=0.27", "pandas>=2.2",
  "numpy>=1.26", "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:alembic.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aqt*"]
